name: Import ValoVault Phase 08 Pass 02 Source

on:
  push:
    branches:
      - import/phase-08-pass-02-source

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout importer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified Phase 08 Pass 02 source
        shell: bash
        run: |
          set -euo pipefail
          cat history-import/phase08-pass02/overlay-*.b64 | base64 --decode > /tmp/ValoVault_PHASE_08_PASS_02_OVERLAY.tar.xz
          echo "f398038be257606fcba61f56259c78b970bf9b0ab12310ffbd2a93a97f5a89d0  /tmp/ValoVault_PHASE_08_PASS_02_OVERLAY.tar.xz" | sha256sum -c -
          echo "f814f36bd28528a35e2ef7fd87aec8a691a7f070cb2350d51948877ab7d607b7  checkpoints/ValoVault_PHASE_08_PASS_01_GITHUB_SOURCE.tar.xz" | sha256sum -c -
          rm -rf /tmp/valovault-p8p2
          mkdir -p /tmp/valovault-p8p2
          tar -xJf checkpoints/ValoVault_PHASE_08_PASS_01_GITHUB_SOURCE.tar.xz -C /tmp/valovault-p8p2
          test -d /tmp/valovault-p8p2/skin-vault-lab
          tar -xJf /tmp/ValoVault_PHASE_08_PASS_02_OVERLAY.tar.xz -C /tmp/valovault-p8p2/skin-vault-lab
          rm -rf /tmp/valovault-p8p2/skin-vault-lab/tools/fidelity/output
          test -f /tmp/valovault-p8p2/skin-vault-lab/CURRENT_STATE.md
          test -f /tmp/valovault-p8p2/skin-vault-lab/tools/fidelity/capture_sessions.py
          test -f /tmp/valovault-p8p2/skin-vault-lab/tools/fidelity/index_capture_sessions.py
          test -f /tmp/valovault-p8p2/skin-vault-lab/packages/shared-schema/capture-session.schema.json
          test -f /tmp/valovault-p8p2/skin-vault-lab/tests/test_phase8_capture_preflight.py
          grep -q "Phase 08 Pass 02" /tmp/valovault-p8p2/skin-vault-lab/CURRENT_STATE.md

      - name: Publish direct runnable source to main and milestone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish origin/main
          rsync -a /tmp/valovault-p8p2/skin-vault-lab/ ./
          rm -rf tools/fidelity/output
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Phase 08 Pass 02: capture-session preflight"
          fi
          git push origin HEAD:main
          git branch -f milestone/phase-08-pass-02 HEAD
          git push origin milestone/phase-08-pass-02 --force
